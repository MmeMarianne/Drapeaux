<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz des drapeaux</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--text:#1b2233;--muted:#667085;--line:#d9deea;--accent:#2f5bea;--ok:#1f9d55;--bad:#d64545}
@media (prefers-color-scheme:dark){:root{--bg:#12151d;--card:#1b2030;--text:#eef1f8;--muted:#9aa4bd;--line:#2d3550;--accent:#6c8cff;--ok:#38c172;--bad:#ef6a6a}}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:flex;justify-content:center;padding:16px;box-sizing:border-box}
.app{width:100%;max-width:520px}
h1{font-size:1.3rem;text-align:center;margin:8px 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;text-align:center}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:600}
.lives{font-size:1.5rem;letter-spacing:4px}
.muted{color:var(--muted);font-size:.9rem}
.flag{height:190px;display:flex;align-items:center;justify-content:center;margin:10px 0;font-size:7rem;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.flag img{max-width:100%;max-height:100%;object-fit:contain;border:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,.15)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.choices button,.big{font:inherit;font-weight:600;padding:14px 8px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--text);cursor:pointer}
.choices button:hover:not(:disabled){border-color:var(--accent)}
.choices button.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.choices button.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.big{background:var(--accent);border-color:var(--accent);color:#fff;font-size:1.05rem;padding:14px 28px;margin-top:16px}
.score{font-size:4rem;font-weight:800;margin:6px 0}
.hide{display:none}
</style>
</head>
<body>
<div class="app">
  <h1>🌍 Quiz des drapeaux</h1>

  <div id="start" class="card">
    <p>Devine le pays de chaque drapeau.<br>Tu as <b>3 vies</b>. Une erreur = une vie perdue.</p>
    <p class="muted"><span id="total"></span> drapeaux · Record : <b id="rec0">0</b></p>
    <button class="big" id="go">Jouer</button>
    <p class="muted">Connexion internet requise (images Wikimedia Commons).</p>
  </div>

  <div id="game" class="card hide">
    <div class="bar"><span>Score : <span id="sc">0</span></span><span class="lives" id="lives"></span></div>
    <div class="flag" id="flag"></div>
    <div class="choices" id="choices"></div>
  </div>

  <div id="end" class="card hide">
    <div id="endTitle" class="muted"></div>
    <div class="score" id="final">0</div>
    <div>drapeaux réussis</div>
    <p id="recMsg" style="font-weight:600"></p>
    <p class="muted">Record : <b id="rec1">0</b></p>
    <button class="big" id="again">Recommencer</button>
  </div>
</div>

<script>
// Format : CODE_ISO:Nom français|nom anglais du fichier Commons (si différent)
const RAW="AF:Afghanistan|the Taliban,ZA:Afrique du Sud|South Africa,AL:Albanie|Albania,DZ:Algérie|Algeria,DE:Allemagne|Germany,AD:Andorre|Andorra,AO:Angola,AG:Antigua-et-Barbuda|Antigua and Barbuda,SA:Arabie saoudite|Saudi Arabia,AR:Argentine|Argentina,AM:Arménie|Armenia,AU:Australie|Australia,AT:Autriche|Austria,AZ:Azerbaïdjan|Azerbaijan,BS:Bahamas|the Bahamas,BH:Bahreïn|Bahrain,BD:Bangladesh,BB:Barbade|Barbados,BE:Belgique|Belgium,BZ:Belize,BJ:Bénin|Benin,BT:Bhoutan|Bhutan,BY:Biélorussie|Belarus,MM:Birmanie|Myanmar,BO:Bolivie|Bolivia,BA:Bosnie-Herzégovine|Bosnia and Herzegovina,BW:Botswana,BR:Brésil|Brazil,BN:Brunéi|Brunei,BG:Bulgarie|Bulgaria,BF:Burkina Faso,BI:Burundi,KH:Cambodge|Cambodia,CM:Cameroun|Cameroon,CA:Canada,CV:Cap-Vert|Cape Verde,CL:Chili|Chile,CN:Chine|the People's Republic of China,CY:Chypre|Cyprus,CO:Colombie|Colombia,KM:Comores|the Comoros,CG:Congo|the Republic of the Congo,CD:RD Congo|the Democratic Republic of the Congo,KP:Corée du Nord|North Korea,KR:Corée du Sud|South Korea,CR:Costa Rica,CI:Côte d’Ivoire|Côte d'Ivoire,HR:Croatie|Croatia,CU:Cuba,DK:Danemark|Denmark,DJ:Djibouti,DM:Dominique|Dominica,EG:Égypte|Egypt,SV:Salvador|El Salvador,AE:Émirats arabes unis|the United Arab Emirates,EC:Équateur|Ecuador,ER:Érythrée|Eritrea,ES:Espagne|Spain,EE:Estonie|Estonia,SZ:Eswatini,US:États-Unis|the United States,ET:Éthiopie|Ethiopia,FJ:Fidji|Fiji,FI:Finlande|Finland,FR:France,GA:Gabon,GM:Gambie|The Gambia,GE:Géorgie|Georgia,GH:Ghana,GR:Grèce|Greece,GD:Grenade|Grenada,GT:Guatemala,GN:Guinée|Guinea,GQ:Guinée équatoriale|Equatorial Guinea,GW:Guinée-Bissau|Guinea-Bissau,GY:Guyana,HT:Haïti|Haiti,HN:Honduras,HU:Hongrie|Hungary,IN:Inde|India,ID:Indonésie|Indonesia,IQ:Irak|Iraq,IR:Iran,IE:Irlande|Ireland,IS:Islande|Iceland,IL:Israël|Israel,IT:Italie|Italy,JM:Jamaïque|Jamaica,JP:Japon|Japan,JO:Jordanie|Jordan,KZ:Kazakhstan,KE:Kenya,KG:Kirghizistan|Kyrgyzstan,KI:Kiribati,KW:Koweït|Kuwait,LA:Laos,LS:Lesotho,LV:Lettonie|Latvia,LB:Liban|Lebanon,LR:Libéria|Liberia,LY:Libye|Libya,LI:Liechtenstein,LT:Lituanie|Lithuania,LU:Luxembourg,MK:Macédoine du Nord|North Macedonia,MG:Madagascar,MY:Malaisie|Malaysia,MW:Malawi,MV:Maldives,ML:Mali,MT:Malte|Malta,MA:Maroc|Morocco,MH:Îles Marshall|the Marshall Islands,MU:Maurice|Mauritius,MR:Mauritanie|Mauritania,MX:Mexique|Mexico,FM:Micronésie|the Federated States of Micronesia,MD:Moldavie|Moldova,MC:Monaco,MN:Mongolie|Mongolia,ME:Monténégro|Montenegro,MZ:Mozambique,NA:Namibie|Namibia,NR:Nauru,NP:Népal|Nepal,NI:Nicaragua,NE:Niger,NG:Nigéria|Nigeria,NO:Norvège|Norway,NZ:Nouvelle-Zélande|New Zealand,OM:Oman,UG:Ouganda|Uganda,UZ:Ouzbékistan|Uzbekistan,PK:Pakistan,PW:Palaos|Palau,PS:Palestine,PA:Panama,PG:Papouasie-Nouvelle-Guinée|Papua New Guinea,PY:Paraguay,NL:Pays-Bas|the Netherlands,PE:Pérou|Peru,PH:Philippines|the Philippines,PL:Pologne|Poland,PT:Portugal,QA:Qatar,CF:République centrafricaine|the Central African Republic,DO:République dominicaine|the Dominican Republic,CZ:Tchéquie|the Czech Republic,RO:Roumanie|Romania,GB:Royaume-Uni|the United Kingdom (1-2),RU:Russie|Russia,RW:Rwanda,KN:Saint-Christophe-et-Niévès|Saint Kitts and Nevis,SM:Saint-Marin|San Marino,VC:Saint-Vincent-et-les-Grenadines|Saint Vincent and the Grenadines,LC:Sainte-Lucie|Saint Lucia,SB:Îles Salomon|the Solomon Islands,WS:Samoa,ST:Sao Tomé-et-Principe|São Tomé and Príncipe,SN:Sénégal|Senegal,RS:Serbie|Serbia,SC:Seychelles,SL:Sierra Leone,SG:Singapour|Singapore,SK:Slovaquie|Slovakia,SI:Slovénie|Slovenia,SO:Somalie|Somalia,SD:Soudan|Sudan,SS:Soudan du Sud|South Sudan,LK:Sri Lanka,SE:Suède|Sweden,CH:Suisse|Switzerland,SR:Suriname,SY:Syrie|Syria,TJ:Tadjikistan|Tajikistan,TZ:Tanzanie|Tanzania,TD:Tchad|Chad,TH:Thaïlande|Thailand,TL:Timor oriental|East Timor,TG:Togo,TO:Tonga,TT:Trinité-et-Tobago|Trinidad and Tobago,TN:Tunisie|Tunisia,TM:Turkménistan|Turkmenistan,TR:Turquie|Turkey,TV:Tuvalu,UA:Ukraine,UY:Uruguay,VU:Vanuatu,VA:Vatican|the Vatican City,VE:Venezuela,VN:Vietnam,YE:Yémen|Yemen,ZM:Zambie|Zambia,ZW:Zimbabwe";
const C=RAW.split(",").map(s=>{
  const [c,rest]=s.split(":"),[n,en]=rest.split("|");
  const file="Flag of "+(en||n)+".svg";
  return{n,c,
    img:"https://commons.wikimedia.org/wiki/Special:FilePath/"+encodeURIComponent(file.replace(/ /g,"_"))+"?width=500",
    f:String.fromCodePoint(...[...c].map(x=>0x1F1E6+x.charCodeAt(0)-65))};
});
const $=id=>document.getElementById(id);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let record=0;
try{record=parseInt(localStorage.getItem("flagRecordWiki")||"0")||0}catch(e){}
let deck,idx,score,lives,locked;
$("total").textContent=C.length;
const show=id=>["start","game","end"].forEach(x=>$(x).classList.toggle("hide",x!==id));
const upd=()=>{$("rec0").textContent=$("rec1").textContent=record};
function start(){deck=shuffle(C);idx=0;score=0;lives=3;show("game");next()}
function hearts(){$("lives").textContent="❤️".repeat(lives)+"🖤".repeat(3-lives);$("sc").textContent=score}
function next(){
  if(idx>=deck.length)return end(true);
  locked=false;hearts();
  const cur=deck[idx],fl=$("flag");
  fl.textContent="";
  const im=new Image();
  im.alt="Drapeau";
  im.onerror=()=>{fl.textContent=cur.f};
  im.src=cur.img;
  fl.appendChild(im);
  if(deck[idx+1])new Image().src=deck[idx+1].img; // précharge le suivant
  const opts=shuffle([cur,...shuffle(C.filter(c=>c!==cur)).slice(0,3)]);
  $("choices").innerHTML="";
  opts.forEach(o=>{const b=document.createElement("button");b.textContent=o.n;b.onclick=()=>pick(b,o,cur);$("choices").appendChild(b)});
}
function pick(btn,o,cur){
  if(locked)return;locked=true;
  const ok=o===cur;
  [...$("choices").children].forEach(b=>{if(b.textContent===cur.n)b.classList.add("ok")});
  if(ok)score++;else{btn.classList.add("bad");lives--}
  hearts();
  setTimeout(()=>{idx++;lives<=0?end(false):next()},ok?500:1300);
}
function end(win){
  const nr=score>record;
  if(nr){record=score;try{localStorage.setItem("flagRecordWiki",record)}catch(e){}}
  $("endTitle").textContent=win?"Bravo, tu as fait tous les drapeaux !":"Plus de vies !";
  $("final").textContent=score;
  $("recMsg").textContent=nr?"🏆 Nouveau record !":(score===record?"Tu égales ton record.":"Encore "+(record-score+1)+" pour battre ton record.");
  upd();show("end");
}
$("go").onclick=$("again").onclick=start;
upd();
</script>
</body>
</html>
